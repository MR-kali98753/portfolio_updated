# Performance Optimization Configuration
performance:
  # Animation settings
  animations:
    enable_cursor_trail: true
    enable_motion_graphics: true
    quality: "medium"  # low, medium, high
    particle_count: 25
    throttle_fps: 60
  
  # Rendering optimizations
  rendering:
    enable_virtualization: true
    lazy_load_components: true
    prefetch_critical_assets: true
    compress_images: true
  
  # Build optimizations
  build:
    minify: true
    tree_shaking: true
    split_chunks: true
    gzip_compression: true
  
  # Device-specific settings
  device_profiles:
    mobile:
      animations:
        quality: "low"
        particle_count: 10
        enable_cursor_trail: false
    
    tablet:
      animations:
        quality: "medium"
        particle_count: 15
        enable_cursor_trail: true
    
    desktop:
      animations:
        quality: "high"
        particle_count: 25
        enable_cursor_trail: true

# Environment-specific overrides
environments:
  development:
    performance:
      animations:
        quality: "high"
        enable_cursor_trail: true
        enable_motion_graphics: true
  
  production:
    performance:
      animations:
        quality: "medium"
        enable_cursor_trail: false  # Disabled by default for better performance
        enable_motion_graphics: true