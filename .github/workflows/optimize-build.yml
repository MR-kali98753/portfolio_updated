name: Optimize Build and Performance

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  optimize:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x]
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Analyze bundle size
      run: |
        npm install --save-dev webpack-bundle-analyzer
        # Add bundle analyzer script to package.json
        npm run build
        
    - name: Optimize animations for production
      run: |
        echo "Creating performance optimized build..."
        echo "NODE_ENV=production" >> $GITHUB_ENV
        echo "GENERATE_SOURCEMAP=false" >> $GITHUB_ENV
        echo "TERSER_PARALLEL=true" >> $GITHUB_ENV
        echo "IMAGE_INLINE_SIZE_LIMIT=10000" >> $GITHUB_ENV
    
    - name: Set Vite build optimizations
      run: |
        echo "Creating vite.config.optimized.ts"
        cat > vite.config.optimized.ts << 'EOF'
        import { defineConfig } from "vite";
        import react from "@vitejs/plugin-react-swc";
        import path from "path";
        
        export default defineConfig({
          server: {
            host: "::",
            port: 8080,
          },
          plugins: [
            react(),
          ],
          resolve: {
            alias: {
              "@": path.resolve(__dirname, "./src"),
            },
          },
          build: {
            // Optimize for performance
            target: "es2015",
            outDir: "dist",
            assetsDir: "assets",
            minify: "terser",
            terserOptions: {
              compress: {
                drop_console: true,
                drop_debugger: true,
                pure_funcs: ['console.log', 'console.info', 'console.debug']
              },
              mangle: true,
              keep_classnames: false,
              keep_fnames: false,
            },
            rollupOptions: {
              output: {
                manualChunks: {
                  vendor: ['react', 'react-dom'],
                  framer: ['framer-motion'],
                  ui: ['@radix-ui/react-*'],
                }
              }
            },
            chunkSizeWarningLimit: 1000,
            cssCodeSplit: true,
            sourcemap: false,
          },
          esbuild: {
            drop: ['console', 'debugger'],
          },
          optimizeDeps: {
            include: ['react', 'react-dom', 'framer-motion'],
            exclude: []
          }
        });
        EOF
    
    - name: Create performance optimization config
      run: |
        echo "Creating performance optimization settings..."
        cat > performance.config.json << 'EOF'
        {
          "animationOptimization": {
            "reduceMotionOnLowPerformance": true,
            "fallbackToStaticElements": true,
            "limitParticleCount": {
              "low": 10,
              "medium": 20,
              "high": 30
            },
            "disableComplexAnimations": true,
            "throttleAnimationUpdates": 16
          },
          "renderingOptimization": {
            "enableVirtualization": true,
            "lazyLoadComponents": true,
            "prefetchCriticalAssets": true,
            "compressImages": true
          },
          "bundleOptimization": {
            "splitChunks": true,
            "minify": true,
            "treeShaking": true,
            "gzipCompression": true
          }
        }
        EOF
    
    - name: Create environment-specific configs
      run: |
        echo "Creating environment configs..."
        
        # Production config
        cat > .env.production << 'EOF'
        NODE_ENV=production
        VITE_APP_PERFORMANCE_MODE=high
        VITE_APP_ANIMATION_QUALITY=low
        VITE_APP_PARTICLE_COUNT=15
        VITE_APP_ENABLE_CURSOR_TRAIL=false
        VITE_APP_ENABLE_MOTION_GRAPHICS=false
        EOF
        
        # Development config
        cat > .env.development << 'EOF'
        NODE_ENV=development
        VITE_APP_PERFORMANCE_MODE=development
        VITE_APP_ANIMATION_QUALITY=high
        VITE_APP_PARTICLE_COUNT=30
        VITE_APP_ENABLE_CURSOR_TRAIL=true
        VITE_APP_ENABLE_MOTION_GRAPHICS=true
        EOF
    
    - name: Update package.json with performance scripts
      run: |
        # Save the current package.json
        cp package.json package.json.bak
        
        # Add performance optimization scripts
        node << 'EOF'
        const fs = require('fs');
        const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
        
        packageJson.scripts = {
          ...packageJson.scripts,
          "build:optimized": "vite build --config vite.config.optimized.ts",
          "build:perf": "cross-env NODE_ENV=production GENERATE_SOURCEMAP=false vite build",
          "analyze": "vite-bundle-visualizer",
          "perf": "npm run build:perf && npm run analyze"
        };
        
        fs.writeFileSync('package.json', JSON.stringify(packageJson, null, 2));
        EOF
    
    - name: Commit optimized configuration
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add .github/workflows/optimize-build.yml
        git add vite.config.optimized.ts
        git add performance.config.json
        git add .env.production
        git add .env.development
        git add package.json
        git diff --cached --quiet || git commit -m "Add performance optimization configuration"